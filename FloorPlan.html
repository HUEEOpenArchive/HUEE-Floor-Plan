<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EE Binası — Kat Planları</title>
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171329;
  --panel:#211a38;
  --panel2:#292044;
  --grid:rgba(124,90,199,0.10);

  --line:#7c5ac7;
  --line-strong:#d8c7ff;

  --text:#f5f1ff;
  --dim:#a79bbd;

  --accent:#ff6b9d;
  --accent-dim:rgba(255,107,157,0.20);

  --corridor:rgba(255,196,87,0.60);

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f1fb; --panel:#ffffff; --panel2:#f0ecfb; --grid:rgba(124,90,199,0.08);
    --line:#b9a4e8; --line-strong:#5a3fa0; --text:#241c3d; --dim:#6d6285;
    --accent:#d63c78; --accent-dim:rgba(214,60,120,0.15); --corridor:rgba(200,140,20,0.5);
  }
}
:root[data-theme="dark"]{
  --bg:#171329; --panel:#211a38; --panel2:#292044; --line:#7c5ac7; --line-strong:#d8c7ff;
  --text:#f5f1ff; --dim:#a79bbd; --accent:#ff6b9d; --accent-dim:rgba(255,107,157,0.20); --corridor:rgba(255,196,87,0.60);
}

*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;
  background-size:28px 28px; min-height:100%;}
header{padding:26px 32px 6px;}
h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.45rem;margin:0 0 4px;}
.sub{color:var(--dim);font-size:0.9rem;margin:0;}

.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  padding:10px 32px;}
.floor-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.floor-tab{font-family:'Space Grotesk',sans-serif;font-size:0.85rem;font-weight:600;color:var(--dim);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;
  transition:background .12s,color .12s,border-color .12s;}
.floor-tab:hover{border-color:var(--accent);color:var(--text);}
.floor-tab.active{background:var(--accent);border-color:var(--accent);color:#1a1030;}

.search-wrap{position:relative;min-width:220px;flex:1;max-width:320px;}
.search-wrap input{width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:0.9rem;color:var(--text);
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px;outline:none;}
.search-wrap input:focus{border-color:var(--accent);}
.search-count{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:0.72rem;color:var(--dim);
  pointer-events:none;}

.layout{display:grid;grid-template-columns:1fr 300px;gap:20px;padding:12px 32px 6px;}
.plan-wrap{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:14px;overflow-x:auto;}
svg{width:100%;height:auto;display:block;min-width:480px;}
.mass{fill:var(--panel);}
.outline{fill:none;stroke:var(--line-strong);stroke-width:2;}
.corridor{fill:none;stroke:var(--corridor);stroke-width:6;stroke-linejoin:round;}
.corridor-center{fill:none;stroke:rgba(10,25,41,0.5);stroke-width:1;stroke-dasharray:5 4;}
.room{fill:var(--panel2);stroke:var(--line);stroke-width:1.3;cursor:pointer;transition:fill .12s,stroke .12s,opacity .12s;}
.room:hover{stroke:var(--accent);}
.room.selected{fill:var(--accent-dim);stroke:var(--accent);stroke-width:2;}
.room-g.hidden{display:none;}
.room-label{font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:600;fill:var(--line-strong);
  text-transform:uppercase;pointer-events:none;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;
  position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;min-height:240px;}
.panel-empty{color:var(--dim);font-size:0.9rem;line-height:1.5;}
.panel h2{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;margin:0 0 2px;color:var(--accent);}
.panel .room-type{color:var(--dim);font-size:0.85rem;margin-bottom:16px;}
.field{margin-bottom:12px;}
.field-label{font-size:0.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:2px;}
.field-value{font-size:0.95rem;line-height:1.4;}
.note{color:var(--dim);font-size:0.78rem;padding:0 32px 22px;max-width:680px;line-height:1.55;}

footer{margin-top:24px;border-top:1px solid var(--line);padding:24px 32px calc(24px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;}
footer .col h3{font-family:'Space Grotesk',sans-serif;font-size:0.85rem;color:var(--line-strong);margin:0 0 8px;}
footer .col p, footer .col a{font-size:0.82rem;color:var(--dim);line-height:1.7;text-decoration:none;display:block;}
footer .col a:hover{color:var(--accent);}
footer .bottom{width:100%;text-align:center;font-size:0.75rem;color:var(--dim);margin-top:12px;}

@media (max-width:760px){.layout{grid-template-columns:1fr;}.panel{position:static;}}
</style>
</head>

<header>
  <h1>EE Binası — Kat Planları</h1>
  <p class="sub">Bir kat seçin, aramak istediğiniz odayı yazın veya doğrudan plan üzerinden tıklayın.</p>
</header>

<div class="controls">
  <div class="floor-tabs" id="floorTabs"></div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Oda ara (isim veya numara)...">
    <span class="search-count" id="searchCount"></span>
  </div>
</div>

<div class="layout">
  <div class="plan-wrap"><svg viewBox="0 0 880 730" id="plan"></svg></div>
  <div class="panel" id="panel"><div class="panel-empty">Bilgilerini görmek için bir odaya tıklayın.</div></div>
</div>

<footer>
  <div class="col">
    <h3>EE Binası</h3>
    <p>Elektrik-Elektronik Mühendisliği Bölümü</p>
    <p>Kat planları ve oda bilgileri</p>
  </div>
  <div class="col">
    <h3>Bağlantılar</h3>

    <a href="https://github.com/HUEEOpenArchive/HUEE-Floor-Plan">GitHub repository</a>
  </div>

</footer>

let currentFloor = Object.keys(FLOORS)[0];

function buildRoomLabel(r){
  const name = r.name || "";
  const minFont = 3, maxFont = 20, charWidthMultiplier = 0.6, lineSpacing = 1.2, textMargin = 1;
  let availW = r.w - (textMargin*2); let availH = r.h - (textMargin*2);
  if (availW <= 0) availW = r.w; if (availH <= 0) availH = r.h;
  let bestFontSize = minFont, bestLines = [];
  for (let f = maxFont; f >= minFont; f -= 1) {
    let maxChars = Math.floor(availW / (f * charWidthMultiplier));
    if (maxChars < 1) maxChars = 1;
    const words = name.split(" ");
    let lines = []; let currentLine = words[0] || ""; let widthFits = true;
    if ((words[0]||"").length > maxChars) widthFits = false;
    for (let i = 1; i < words.length; i++) {
      if (words[i].length > maxChars) widthFits = false;
      if (currentLine.length + 1 + words[i].length <= maxChars) currentLine += " " + words[i];
      else { lines.push(currentLine); currentLine = words[i]; }
    }
    lines.push(currentLine);
    const totalHeight = lines.length * (f * lineSpacing);
    if (widthFits && totalHeight <= availH) { bestFontSize = f; bestLines = lines; break; }
  }
  if (bestLines.length === 0) {
    bestFontSize = minFont;
    let maxChars = Math.floor(availW / (bestFontSize * charWidthMultiplier));
    if (maxChars < 1) maxChars = 1;
    const words = name.split(" ");
    let lines = []; let currentLine = words[0] || "";
    for (let i = 1; i < words.length; i++) {
      if (currentLine.length + 1 + words[i].length <= maxChars) currentLine += " " + words[i];
      else { lines.push(currentLine); currentLine = words[i]; }
    }
    lines.push(currentLine);
    bestLines = lines;
  }
  const lineHeight = bestFontSize * lineSpacing;
  const startY = (r.y + r.h/2) - ((bestLines.length - 1) * lineHeight)/2 + (bestFontSize/3);
  const textHtml = bestLines.map((line, i) =>
    `<tspan x="${r.x + r.w/2}" y="${startY + (i*lineHeight)}">${line}</tspan>`).join("");
  return `<text class="room-label" text-anchor="middle" style="font-size:${bestFontSize}px;pointer-events:none;">${textHtml}</text>`;
}

function renderFloor(key){
  currentFloor = key;
  const floor = FLOORS[key];
  const svg = document.getElementById("plan");
  let html = `
    <path class="mass" d="${floor.outer}"/>
    <path class="outline" d="${floor.outer}"/>
    <path class="corridor" d="${floor.corridor}"/>
    <path class="corridor-center" d="${floor.corridor}"/>
  `;
  floor.rooms.forEach(r => {
    html += `<g class="room-g" data-room="${r.id}" data-search="${(r.name+" "+(r.room_code||"")).toLowerCase()}" onclick="selectRoom('${r.id}')">
      <rect class="room" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="3"/>
      ${buildRoomLabel(r)}
    </g>`;
  });
  svg.innerHTML = html;
  document.getElementById("panel").innerHTML = `<div class="panel-empty">Bilgilerini görmek için bir odaya tıklayın.</div>`;

  document.querySelectorAll(".floor-tab").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.floor === key);
  });

  applySearch();
}

function selectRoom(id){
  document.querySelectorAll(".room.selected").forEach(r=>r.classList.remove("selected"));
  const target = document.querySelector(`[data-room="${id}"] rect.room`);
  if (target) target.classList.add("selected");
  const r = FLOORS[currentFloor].rooms.find(x=>x.id===id);
  if (!r) return;
  document.getElementById("panel").innerHTML = `
    <h2>${r.name}</h2>
    <div class="room-type">${r.type}${r.room_code && r.room_code!=="unknown" ? " · " + r.room_code : ""}</div>
    <div class="field"><div class="field-label">Açıklama</div><div class="field-value">${r.info || "—"}</div></div>
  `;
}

function applySearch(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const groups = document.querySelectorAll(".room-g");
  let visibleCount = 0;
  groups.forEach(g=>{
    const matches = q === "" || g.dataset.search.includes(q);
    g.classList.toggle("hidden", !matches);
    if (matches) visibleCount++;
  });
  const counter = document.getElementById("searchCount");
  counter.textContent = q === "" ? "" : `${visibleCount} sonuç`;
}

function buildTabs(){
  const wrap = document.getElementById("floorTabs");
  wrap.innerHTML = Object.keys(FLOORS).map(key =>
    `<button class="floor-tab" data-floor="${key}" onclick="renderFloor('${key}')">${FLOORS[key].label}</button>`
  ).join("");
}

document.getElementById("searchInput").addEventListener("input", applySearch);

buildTabs();
renderFloor(currentFloor);
</script>
