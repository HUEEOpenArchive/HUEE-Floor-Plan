<style>
:root{
  --bg:#171329;
  --panel:#211a38;
  --panel2:#292044;

  --line:#7c5ac7;
  --line-strong:#d8c7ff;

  --text:#f5f1ff;
  --dim:#a79bbd;

  --accent:#ff6b9d;
  --accent-dim:rgba(255,107,157,0.20);

  --corridor:rgba(255,196,87,0.60);
}

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;}
header{padding:26px 32px 6px;}
h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.45rem;margin:0 0 4px;}
.sub{color:var(--dim);font-size:0.9rem;margin:0;}
.layout{display:grid;grid-template-columns:1fr 300px;gap:20px;padding:18px 32px 6px;}
.plan-wrap{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:14px;}
svg{width:100%;height:auto;display:block;}
.mass{fill:var(--panel);}
.outline{fill:none;stroke:var(--line-strong);stroke-width:2;}
.corridor{fill:none;stroke:var(--corridor);stroke-width:6;stroke-linejoin:round;}
.corridor-center{fill:none;stroke:rgba(10,25,41,0.5);stroke-width:1;stroke-dasharray:5 4;}
.room{fill:var(--panel2);stroke:var(--line);stroke-width:1.3;cursor:pointer;transition:fill .12s,stroke .12s;}
.room:hover{stroke:var(--accent);}
.room.selected{fill:var(--accent-dim);stroke:var(--accent);stroke-width:2;}
.room-label{font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:600;fill:var(--line-strong);
  text-transform:uppercase;pointer-events:none;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;
  position:sticky;top:20px;align-self:start;min-height:240px;}
.panel-empty{color:var(--dim);font-size:0.9rem;line-height:1.5;}
.panel h2{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;margin:0 0 2px;color:var(--accent);}
.panel .room-type{color:var(--dim);font-size:0.85rem;margin-bottom:16px;}
.field{margin-bottom:12px;}
.field-label{font-size:0.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:2px;}
.field-value{font-size:0.95rem;line-height:1.4;}
.note{color:var(--dim);font-size:0.78rem;padding:0 32px 22px;max-width:680px;line-height:1.55;}
.note b{color:var(--text);}
.note code{color:var(--line-strong);}
@media (max-width:760px){.layout{grid-template-columns:1fr;}.panel{position:static;}}
</style>
</head>

  {id:"AlperenBerber", type:"Ofis", name:"Alperen Berber", x:195,y:28,w:30,h:28, room_code:"4214", info:"Alperen Berber'in ofisi."},
  {id:"FurkanSabriDipi", type:"Ofis", name:"Furkan Sabri Dipi", x:228,y:28,w:30,h:28, room_code:"4210", info:"Furkan Sabri Dipi'nin ofisi."},

  {id:"ElektromanyetikArastirmaLab", type:"Laboratuvar", name:"Elektromanyetik Araştırma Laboratuvarı", x:655,y:545,w:56,h:36, room_code:"E211", info:""},

  type:r.type, info:r.info}));

const svg = document.getElementById("plan");
let html = `
  <path class="mass" d="${OUTER}"/>
  <path class="outline" d="${OUTER}"/>
  <path class="corridor" d="${CORRIDOR_PATH}"/>
  <path class="corridor-center" d="${CORRIDOR_PATH}"/>
`;
ROOMS_FLOOR1.forEach(r => {
  const name = r.name || "";
  const minFont = 3;
  const maxFont = 20;
  
  const charWidthMultiplier = 0.6; 
  const lineSpacing = 1.2;

  const textMargin = 1;
  let availW = r.w - (textMargin * 2);
  let availH = r.h - (textMargin * 2);
  
  if (availW <= 0) availW = r.w; 
  if (availH <= 0) availH = r.h;
  
  let bestFontSize = minFont;
  let bestLines = [];

  for (let f = maxFont; f >= minFont; f -= 1) {
    let maxChars = Math.floor(availW / (f * charWidthMultiplier));
    if (maxChars < 1) maxChars = 1;

    const words = name.split(" ");
    let lines = [];
    let currentLine = words[0] || "";
    let widthFits = true;

    if ((words[0] || "").length > maxChars) widthFits = false;

    for (let i = 1; i < words.length; i++) {
      if (words[i].length > maxChars) widthFits = false;

      if (currentLine.length + 1 + words[i].length <= maxChars) {
        currentLine += " " + words[i];
      } else {
        lines.push(currentLine);
        currentLine = words[i];
      }
    }
    lines.push(currentLine);

    const totalHeight = lines.length * (f * lineSpacing);

    if (widthFits && totalHeight <= availH) {
      bestFontSize = f;
      bestLines = lines;
      break; 
    }
  }

  if (bestLines.length === 0) {
    bestFontSize = minFont;
    let maxChars = Math.floor(availW / (bestFontSize * charWidthMultiplier));
    if (maxChars < 1) maxChars = 1;
    
    const words = name.split(" ");
    let lines = [];
    let currentLine = words[0] || "";
    for (let i = 1; i < words.length; i++) {
      if (currentLine.length + 1 + words[i].length <= maxChars) {
        currentLine += " " + words[i];
      } else {
        lines.push(currentLine);
        currentLine = words[i];
      }
    }
    lines.push(currentLine);
    bestLines = lines;
  }

  const lineHeight = bestFontSize * lineSpacing;
  
  const startY = (r.y + r.h/2) - ((bestLines.length - 1) * lineHeight) / 2 + (bestFontSize / 3);

  const textHtml = bestLines.map((line, index) => 
    `<tspan x="${r.x + r.w/2}" y="${startY + (index * lineHeight)}">${line}</tspan>`
  ).join("");

  const a = `
  <text class="room-label" text-anchor="middle" style="font-size: ${bestFontSize}px; pointer-events: none;">
    ${textHtml}
  </text>
  `;

  html += `<g class="room-g" data-room="${r.id}" onclick="selectRoom('${r.id}')">
    <rect class="room" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="3"/>
    ${a}
  </g>`;
});
svg.innerHTML = html;

function selectRoom(id){
  document.querySelectorAll(".room.selected").forEach(r=>r.classList.remove("selected"));
  document.querySelector(`[data-room="${id}"] rect.room`).classList.add("selected");
  const r = ROOMS_FLOOR1.find(x=>x.id===id);
  document.getElementById("panel").innerHTML = `
    <h2>${r.name}</h2>
    <div class="room-type">${r.type}</div>
    <div class="field"><div class="field-label">Açıklama</div><div class="field-value">${r.info}</div></div>
  `;
}
